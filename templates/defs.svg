{# The four elements on the next line have to share it: `whitespace = "suppress"` only trims whitespace that touches a tag, so a newline between two of them lands in plain literal text, is emitted verbatim, and moves every golden byte after it. #}
<linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="{{ w04 }}" y2="{{ h }}"><stop offset="0%" stop-color="{{ bg0 }}"/><stop offset="100%" stop-color="{{ bg1 }}"/></linearGradient><radialGradient id="vig"><stop offset="55%" stop-color="#8fa3b8" stop-opacity="0"/><stop offset="100%" stop-color="#8fa3b8" stop-opacity="0.16"/></radialGradient><radialGradient id="halo"><stop offset="0%" stop-color="{{ bg0 }}" stop-opacity="0.92"/><stop offset="55%" stop-color="{{ bg0 }}" stop-opacity="0.65"/><stop offset="100%" stop-color="{{ bg0 }}" stop-opacity="0"/></radialGradient><filter id="ink" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.25"/></filter>
{% for n in nebulae %}
  <radialGradient id="{{ n.0 }}"><stop offset="0%" stop-color="{{ n.1 }}" stop-opacity="0.3"/><stop offset="100%" stop-color="{{ n.1 }}" stop-opacity="0"/></radialGradient>
{% endfor %}