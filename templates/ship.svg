<defs>{% for r in ramps %}<linearGradient id="shp{{ r.0 }}" gradientUnits="userSpaceOnUse" x1="-70" y1="-80" x2="70" y2="60"><stop offset="0%" stop-color="{{ r.1 }}" stop-opacity="0.5"/><stop offset="100%" stop-color="{{ r.1 }}"/></linearGradient>{% endfor %}<linearGradient id="shpe" gradientUnits="userSpaceOnUse" x1="0" y1="{{ cy0 }}" x2="0" y2="{{ cy1 }}"><stop offset="0%" stop-color="{{ lit }}" stop-opacity="0.95"/><stop offset="100%" stop-color="{{ lit }}" stop-opacity="0"/></linearGradient></defs>{% for f in facets %}<polygon points="{{ f.points }}" fill="url(#shp{{ f.ramp }})" fill-opacity="{{ f.opacity }}"/>{% endfor %}<line x1="0" y1="{{ cy0 }}" x2="0" y2="{{ cy1 }}" stroke="url(#shpe)" stroke-width="2.2"/><polygon points="{{ hull }}" fill="none" stroke="{{ a }}" stroke-width="3.6"/><polygon points="{{ core }}" fill="{{ a }}" fill-opacity="0.28" stroke="{{ a }}" stroke-width="2"/>{% for e in exhaust %}<line x1="{{ e.x1 }}" y1="{{ e.y }}" x2="{{ e.x2 }}" y2="{{ e.y }}" stroke="{{ b }}" stroke-width="2.4" stroke-opacity="{{ e.o }}"/>{% endfor %}