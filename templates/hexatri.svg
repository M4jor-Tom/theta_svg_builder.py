{% for r in rings %}
  <polygon{% if let Some(m) = r.motion +%} class="{{ m.cls }}" style="{{ m.style }}"{% endif +%} points="{{ r.points }}" fill="none" stroke="{{ r.col }}" stroke-width="{{ r.swd }}" stroke-opacity="{{ r.o }}"/>
{% endfor %}
<polygon points="{{ core }}" fill="{{ a }}" fill-opacity="0.28" stroke="{{ a }}" stroke-width="2"/>